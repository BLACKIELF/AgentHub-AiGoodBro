<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AiGoodBro · 原有主题与毛玻璃提案 · 0923v8</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", sans-serif; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; }
    button, select { font: inherit; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
    body[data-appearance="dark"] {
      color-scheme: dark; --canvas:#15171e; --surface:#292c34; --surface-2:#252831; --text:#f4f5f8;
      --muted:#bdc1cd; --dim:#a0a6b5; --line:#ffffff19; --track:#ffffff17;
      --warm:#ffbe55; --danger:#ff746b; --good:#59c77d; --shadow:#05081066;
      --window-glass:#16181e99; --header-glass:#34374066; --card-glass:#35384182;
      --nav-glass:#43475447; --control:#ffffff0c; --selected:#ffffff17;
      --edge:#ffffff26; --shine:#ffffff09; --card-shadow:#070b161a;
    }
    body[data-appearance="light"] {
      color-scheme: light; --canvas:#e9ecf2; --surface:#fafbfe; --surface-2:#f0f2f7; --text:#202532;
      --muted:#555e6e; --dim:#656e7f; --line:#23365521; --track:#24375a14;
      --warm:#855300; --danger:#b42318; --good:#147039; --shadow:#202b4930;
      --window-glass:#f0f2f890; --header-glass:#ffffff70; --card-glass:#ffffffa8;
      --nav-glass:#ffffff73; --control:#ffffff70; --selected:#ffffffdc;
      --edge:#ffffffee; --shine:#ffffff70; --card-shadow:#30476b0b;
    }
    .canvas { min-height: 100vh; padding: 28px; background: radial-gradient(ellipse at 4% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 56%), radial-gradient(ellipse at 98% 90%, color-mix(in srgb, var(--secondary) 24%, transparent), transparent 60%), var(--canvas); }
    .window { width: min(100%, 1600px); margin: 0 auto; background: var(--window-glass); border: 1px solid var(--line); border-top-color: var(--edge); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px var(--shadow), 0 1px 2px var(--shadow); }
    .titlebar { height: 65px; display: flex; align-items: center; padding: 0 25px; gap: 15px; border-bottom: 1px solid var(--line); background: linear-gradient(var(--shine), transparent), var(--header-glass); backdrop-filter: blur(28px) saturate(125%); -webkit-backdrop-filter: blur(28px) saturate(125%); }
    .traffic { display: flex; gap: 8px; margin-right: 12px; }
    .traffic i { display: block; width: 11px; height: 11px; border-radius: 50%; background: #ee625c; }
    .traffic i:nth-child(2) { background: #f2bf4f; } .traffic i:nth-child(3) { background: #5fc66b; }
    .brand-icon { width: 28px; height: 28px; object-fit: contain; border-radius: 7px; }
    .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .brand strong { font-size: 20px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
    .brand span { font-size: 12px; font-weight: 550; color: var(--dim); white-space: nowrap; }
    .spacer { flex: 1; }
    .sample { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; }
    .theme-picker { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .theme-picker select { max-width: 140px; height: 28px; padding: 0 25px 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--control); color: var(--text); font-size: 12px; }
    .theme-picker select option { background: var(--surface); color: var(--text); }
    .theme-swatch { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 3px var(--selection-fill); }
    .topnav { margin: 12px 24px 0; height: 43px; display: flex; align-items: center; gap: 4px; padding: 3px 6px; background: linear-gradient(var(--shine), transparent), var(--nav-glass); border: 1px solid var(--line); border-top-color: var(--edge); border-radius: 9px; backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%); box-shadow: 0 3px 10px var(--card-shadow); }
    .navitem { height: 33px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); white-space: nowrap; font-size: 12px; font-weight: 600; }
    .navitem.active { color: var(--accent-text); background: var(--selection-fill); box-shadow: inset 0 0 0 1px var(--selection-stroke); }
    .navitem:hover { color: var(--text); }
    .navitem img { width: 18px; height: 18px; object-fit: contain; }
    .navglyph { width: 17px; text-align: center; color: var(--muted); font-weight: 700; font-size: 16px; }
    .navitem.active .navglyph { color: var(--accent-text); }
    .navmanage { margin-left: auto; }
    main { padding: 18px 26px 12px; }
    .notice { min-height: 43px; display: flex; align-items: center; gap: 16px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--control); font-size: 12px; color: var(--muted); }
    .notice .label { color: var(--text); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .notice .label b { color: var(--accent-text); margin-right: 8px; }
    .notice .state { color: var(--warm); font-weight: 700; }
    .notice .count { color: var(--warm); font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .notice .side { margin-left: auto; white-space: nowrap; }
    .sectionhead { display: flex; align-items: center; margin: 21px 0 11px; gap: 14px; min-height: 32px; }
    .sectionhead h1 { font-size: 16px; margin: 0; letter-spacing: -.015em; font-weight: 700; }
    .sectionhead h1 span { margin-left: 7px; color: var(--dim); font-size: 13px; }
    .sectmark { width: 23px; height: 23px; object-fit: contain; }
    .textbutton, .switcher button { color: var(--muted); border: 1px solid var(--line); background: var(--control); border-radius: 6px; height: 28px; padding: 0 9px; font-size: 12px; font-weight: 600; }
    .textbutton:hover, .switcher button:hover { color: var(--text); }
    .textbutton.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .switcher { display: flex; border: 1px solid var(--line); border-radius: 7px; background: var(--control); padding: 2px; gap: 1px; }
    .switcher button { border: 0; background: transparent; height: 24px; padding: 0 10px; }
    .switcher button[aria-pressed="true"] { color: var(--text); background: var(--selected); box-shadow: 0 1px 3px var(--card-shadow), inset 0 1px var(--edge); }
    .accounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .account { min-width: 0; min-height: 265px; display: flex; flex-direction: column; padding: 14px 15px 13px; border: 1px solid var(--line); border-top-color: var(--edge); border-radius: 10px; background: linear-gradient(145deg, var(--shine), transparent 65%), var(--card-glass); backdrop-filter: blur(22px) saturate(115%); -webkit-backdrop-filter: blur(22px) saturate(115%); box-shadow: 0 4px 14px var(--card-shadow), inset 0 1px 0 var(--shine); }
    .account.featured { border-color: var(--selection-stroke); box-shadow: 0 4px 14px var(--card-shadow), inset 0 1px 0 var(--shine); }
    .accthead { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .num { color: var(--dim); font: 700 12px ui-monospace, SFMono-Regular, monospace; letter-spacing: .02em; }
    .accticon { width: 22px; height: 22px; border-radius: 5px; object-fit: contain; }
    .acctname { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tier { margin-left: auto; flex: 0 0 auto; background: var(--selection-fill); color: var(--accent-text); border-radius: 5px; padding: 3px 7px; font-size: 10px; font-weight: 700; letter-spacing: .03em; }
    .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .status { display: inline-flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 5px; height: 5px; background: var(--dim); border-radius: 50%; }
    .status.current::before { background: var(--good); }
    .balance { margin-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; color: var(--dim); font-size: 11px; }
    .balance strong { color: var(--text); font-weight: 650; }
    .limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-top: 10px; }
    .limit { min-width: 0; }
    .limit-top { display: flex; align-items: baseline; justify-content: space-between; gap: 5px; }
    .limit-top span { color: var(--muted); font-size: 11px; font-weight: 600; }
    .limit-top strong { color: var(--text); font-size: 21px; line-height: 1.1; font-weight: 650; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
    .track { height: 5px; overflow: hidden; border-radius: 3px; margin: 7px 0 9px; background: var(--quota-track); }
    .track i { height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg, var(--quota-start), var(--quota-end)); width: var(--pct); }
    .limit.secondary .track { background: var(--quota-secondary-track); }
    .limit.secondary .track i { background: linear-gradient(90deg, var(--quota-secondary-start), var(--quota-secondary-end)); }
    .limit.low .track i { background: var(--danger); }
    .limit.warn .track i { background: var(--warm); }
    .when { color: var(--muted); font-size: 10.5px; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .when b { color: var(--text); font-weight: 620; }
    .acctactions { margin-top: auto; padding-top: 10px; display: flex; align-items: center; border-top: 1px solid var(--line); gap: 6px; }
    .iconbtn { min-width: 29px; height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--control); color: var(--muted); font-size: 16px; line-height: 1; }
    .iconbtn.terminal { color: var(--accent-text); font-size: 15px; font-weight: 700; }
    .manage { margin-left: auto; color: var(--text); font-size: 11px; font-weight: 650; border: 0; background: transparent; padding: 4px 2px; }
    .accounts.rows { display: block; border: 1px solid var(--line); border-top-color: var(--edge); border-radius: 9px; overflow-x: auto; background: var(--card-glass); backdrop-filter: blur(22px) saturate(115%); -webkit-backdrop-filter: blur(22px) saturate(115%); }
    .list-header { display: none; }
    .rows .list-header { display: grid; grid-template-columns: minmax(220px, 1.25fr) minmax(135px, .65fr) minmax(200px, .9fr) minmax(280px, 1.3fr) minmax(280px, 1.3fr) 110px; gap: 12px; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 10.5px; font-weight: 650; }
    .rows .account { display: grid; grid-template-columns: minmax(220px, 1.25fr) minmax(135px, .65fr) minmax(200px, .9fr) minmax(280px, 1.3fr) minmax(280px, 1.3fr) 110px; min-height: 76px; padding: 11px 14px; gap: 12px; align-items: center; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
    .rows .account, .rows .list-header { min-width: 1320px; }
    .rows .account:nth-child(odd) { background: var(--control); }
    .rows .account:last-child { border-bottom: 0; }
    .rows .account.featured { box-shadow: inset 2px 0 var(--accent); }
    .rows .accthead { grid-column: 1; }
    .rows .meta { grid-column: 2; display: block; margin: 0; }
    .rows .meta > span { display: block; margin: 3px 0; }
    .rows .balance { grid-column: 3; display: block; margin: 0; padding: 0; border: 0; }
    .rows .balance > span { display: block; margin: 3px 0; }
    .rows .limits { display: contents; }
    .rows .limit { padding: 0 5px; }
    .rows .limit-top strong { font-size: 15px; }
    .rows .track { margin: 4px 0; }
    .rows .acctactions { grid-column: 6; margin: 0; padding: 0; border: 0; }
    .rows .manage { white-space: nowrap; }
    .clihead { display: flex; align-items: baseline; margin: 19px 0 10px; gap: 9px; }
    .clihead strong { font-size: 13px; } .clihead span { color: var(--dim); font-size: 11px; }
    .cli-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cli-item { display: flex; align-items: center; gap: 11px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; }
    .cli-logo { font-weight: 700; font-size: 16px; color: var(--muted); width: 18px; text-align: center; }
    .cli-name { font-weight: 650; }
    .cli-state { margin-left: auto; color: var(--dim); font-size: 11px; }
    footer { height: 44px; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; background: var(--control); }
    footer .right { margin-left: auto; }
    @media(max-width:1200px) { .topnav .hide-medium, .sample { display: none; } .accounts:not(.rows) { grid-template-columns: repeat(2, minmax(0, 1fr)); } .notice { flex-wrap: wrap; gap: 8px 14px; } .notice .side { margin-left: 0; } }
    @media(max-width:760px) { .canvas { padding: 0; } .window { border: 0; border-radius: 0; } .brand span, .sample, .topnav .hide-small, .notice .side, .traffic, .theme-picker label { display: none; } .titlebar { height: auto; min-height: 65px; padding: 12px 14px; flex-wrap: wrap; gap: 10px; } .brand strong { font-size: 17px; } .titlebar .spacer { display: none; } .theme-picker { margin-left: auto; } .theme-picker select { max-width: 105px; } .topnav { margin: 8px 10px 0; overflow-x: auto; } .navitem { padding: 0 9px; } main { padding: 14px 12px; } .sectionhead { gap: 7px; flex-wrap: wrap; } .sectionhead > .textbutton:not(.primary) { display: none; } .accounts:not(.rows) { grid-template-columns: 1fr; } .cli-grid { grid-template-columns: repeat(2, 1fr); } footer { padding: 0 12px; gap: 9px; } footer .right { display: none; } }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .window, .titlebar, .topnav, .account, .accounts.rows { background: var(--surface); } }
    @media(prefers-reduced-transparency:reduce), (prefers-contrast:more) { .canvas { background: var(--canvas); } .window, .titlebar, .topnav, .account, .accounts.rows { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; } .rows .account { background: var(--surface); } .window, .account, .topnav { border-color: var(--dim); } }
  </style>

      const channels = color.slice(1,7).match(/../g).map(value => parseInt(value,16) / 255).map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4);
      return channels[0] * .2126 + channels[1] * .7152 + channels[2] * .0722;
