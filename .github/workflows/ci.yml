name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
    inputs:
      windows:
        description: Explicitly include the existing Windows checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI change selection
        run: python3 -m unittest tests.test_ci_windows_changed
      - id: scope
        name: Select platform checks from changed files
        run: python3 scripts/ci_windows_changed.py

  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare companion build toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: Companion/Hub/go.mod
          cache: false
      - name: Lint Swift sources
        run: make lint
      - name: Build, verify runtime resources, and run self-tests
        run: make test
      - name: Verify Token Monitor and credential integration
        run: |
          python3 -m unittest tests.test_token_monitor_packaging
          python3 scripts/test-statistics-integration.py
          python3 tests/token-monitor-native/run.py
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node tests/token-monitor-native/protocol-boundaries.cjs
          python3 tests/token-monitor-home/run.py
          python3 -m unittest tests.test_aihot_topics tests.test_local_cli_terminal_launcher tests.test_local_cli_accounts tests.test_runtime_setup
          python3 tests/token-monitor-engine/run.py --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine --trusted-receipt ".build-receipts/AiGoodBro/Next/token-monitor-$(uname -m).json"
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-upstream-dashboard-0913v1.js
          python3 scripts/test-upstream-dashboard-cache-0913v1.py
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-opencode-quota-0913v1.cjs --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-disabled-antigravity-oauth-0913v1.cjs --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine
          bash scripts/test-opencode-native-0913v1.sh
          python3 scripts/test-credential-copy-outcomes.py
          python3 scripts/test-auth-stability.py
          python3 scripts/test-automatic-switch-wiring.py
          python3 -m unittest tests.test_account_refresh_frequency
          python3 scripts/test-public-reset-translation.py
      - name: Check shared dispatch coordination and Swift interoperability
        run: |
          python3 scripts/next_dispatch_preflight.py --self-test
          python3 -m unittest tests.test_dispatch_activity tests.test_dispatch_invocation tests.test_cancel_authority tests.test_agent_cli
          python3 tests/test-dispatch-activity-interop.py
          python3 scripts/test-message-channels.py
          bash scripts/test-grok-reset-cards.sh
          python3 -m unittest tests.test_local_cli_quota tests.test_additional_cli_quota tests.test_zcode_cli_quota

  windows-rust-format:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check Windows Rust formatting
        working-directory: windows
        run: cargo fmt --all -- --check
      - name: Test Windows Rust workspace
        working-directory: windows
        run: cargo test --workspace --locked
      - name: Test native visual script contracts with Windows PowerShell 5.1
        shell: powershell
        run: .\windows\scripts\tests\Test-NativeVisualCaptureWorkflow.ps1
      - name: Test native visual script contracts with PowerShell 7
        shell: pwsh
        run: .\windows\scripts\tests\Test-NativeVisualCaptureWorkflow.ps1

  windows-web:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows/apps/codexu-tauri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Install pinned Windows web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Windows web contracts
        run: npm test
      - name: Build Windows web frontend
        run: npm run build

  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs: [changes, macos, windows-rust-format, windows-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks for the selected platforms
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
          RUST_RESULT: ${{ needs.windows-rust-format.result }}
          WEB_RESULT: ${{ needs.windows-web.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$MACOS_RESULT" = success
          if [ "$WINDOWS_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
            test "$WEB_RESULT" = success
          else
            test "$WINDOWS_REQUIRED" = false
            test "$RUST_RESULT" = skipped
            test "$WEB_RESULT" = skipped
          fi
