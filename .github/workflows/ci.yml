name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: Explicitly include the existing Windows checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI change selection
        run: python3 -m unittest tests.test_ci_windows_changed
      - id: scope
        name: Select platform checks from changed files
        run: python3 scripts/ci_windows_changed.py

  macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare companion build toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: Companion/LocalProxy/go.mod
          cache: false
      - name: Lint Swift sources
        run: make lint
      - name: Validate native local proxy host with synthetic accounts
        run: python3 scripts/test-local-proxy-host.py
      - name: Mount pinned Token Monitor desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          dmg="$RUNNER_TEMP/Token-Monitor-0.62.0-arm64.dmg"
          mountpoint="$RUNNER_TEMP/token-monitor-0.62.0"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$dmg" \
            https://github.com/Javis603/token-monitor/releases/download/v0.62.0/Token-Monitor-0.62.0-arm64.dmg
          expected="$(python3 -c 'import json; print(json.load(open("Companion/TokenMonitorDesktop/SOURCE.json"))["runtime"]["officialDMGSHA256"])')"
          printf '%s  %s\n' "$expected" "$dmg" | shasum -a 256 --check -
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
          test -d "$mountpoint/Token Monitor.app"
          printf 'TOKEN_MONITOR_DESKTOP_RUNTIME=%s/Token Monitor.app\n' "$mountpoint" >> "$GITHUB_ENV"
          printf 'TOKEN_MONITOR_DESKTOP_DMG=%s\n' "$dmg" >> "$GITHUB_ENV"
      - name: Build, verify runtime resources, and run self-tests
        run: make test
      - name: Verify Token Monitor and credential integration
        run: |
          python3 -m unittest tests.test_token_monitor_packaging
          AIGOODBRO_TOKEN_CORE_APP="build/AiGoodBro.app/Contents/Helpers/AiGoodBro Token Core.app" python3 scripts/test-token-monitor-desktop-package.py
          python3 scripts/test-token-monitor-desktop-lifecycle.py
          python3 scripts/test-statistics-integration.py
          python3 scripts/test-statistics-cache-identity.py
          python3 tests/token-monitor-native/run.py
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node tests/token-monitor-native/protocol-boundaries.cjs
          python3 tests/token-monitor-home/run.py
          python3 -m unittest tests.test_aihot_topics tests.test_local_cli_terminal_launcher tests.test_local_cli_accounts tests.test_runtime_setup
          python3 tests/token-monitor-engine/run.py --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine --trusted-receipt ".build-receipts/AiGoodBro/Next/token-monitor-$(uname -m).json"
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-upstream-dashboard-0913v1.js
          python3 scripts/test-upstream-dashboard-cache-0913v1.py
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-opencode-quota-0913v1.cjs --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine
          build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine/runtime/node scripts/test-disabled-antigravity-oauth-0913v1.cjs --resource-root build/AiGoodBro.app/Contents/Resources/TokenMonitorEngine
          bash scripts/test-opencode-native-0913v1.sh
          python3 scripts/test-credential-copy-outcomes.py
          python3 scripts/test-auth-stability.py
          python3 scripts/test-automatic-switch-wiring.py
          python3 -m unittest tests.test_account_refresh_frequency
          python3 scripts/test-public-reset-translation.py
          python3 tests/test_public_reset_forecast_boundaries.py
      - name: Check shared dispatch coordination and Swift interoperability
        run: |
          python3 scripts/next_dispatch_preflight.py --self-test
          python3 -m unittest tests.test_dispatch_activity tests.test_dispatch_invocation tests.test_dispatch_profile_workflow tests.test_cancel_authority tests.test_agent_cli
          python3 tests/test-dispatch-activity-interop.py
          python3 scripts/test-message-channels.py
          bash scripts/test-grok-reset-cards.sh
          python3 -m unittest tests.test_local_cli_quota tests.test_additional_cli_quota tests.test_zcode_cli_quota
      - name: Validate independent local proxy with synthetic accounts
        run: |
          python3 scripts/test-invite-purchase-link.py
          python3 scripts/test-local-proxy-quota-refresh.py
          python3 Companion/LocalProxy/fixtures/test-cross-language.py --helper build/AiGoodBro.app/Contents/Resources/LocalProxy/aigoodbro-local-proxy
          cd Companion/LocalProxy
          go test -mod=readonly -race -timeout=3m ./...
          go vet -mod=readonly ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dashboard DOM acceptance (real Chromium)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          node scripts/test-upstream-dashboard-dom-0918v1.js
          node scripts/test-home-dashboard-cost-0928v4.cjs
          node scripts/test-home-dashboard-0928v1.cjs
      - name: Unmount pinned Token Monitor desktop runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/token-monitor-0.62.0"
          if mount | grep -F " on $mountpoint (" >/dev/null; then
            hdiutil detach "$mountpoint"
          fi

  windows-rust-format:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check Windows Rust formatting
        working-directory: windows
        run: cargo fmt --all -- --check
      - name: Save Rust formatting diagnostics
        if: ${{ failure() && !cancelled() }}
        working-directory: windows
        run: |
          cargo fmt --all
          New-Item -ItemType Directory -Force ../.local-artifacts | Out-Null
          git diff --output=../.local-artifacts/windows-rustfmt.patch -- .
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: windows-rustfmt-diagnostic
          path: .local-artifacts/windows-rustfmt.patch
          if-no-files-found: ignore
          retention-days: 3
      - name: Test native visual script contracts with Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          .\windows\scripts\tests\Test-PublicFeedSyntax.ps1
          .\windows\scripts\tests\Test-NativeWindowSelection.ps1
          .\windows\scripts\tests\Test-NativeVisualCaptureWorkflow.ps1
          .\windows\scripts\tests\Test-ReleaseReadiness.ps1
      - name: Test native visual script contracts with PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          .\windows\scripts\tests\Test-PublicFeedSyntax.ps1
          .\windows\scripts\tests\Test-NativeWindowSelection.ps1
          .\windows\scripts\tests\Test-NativeVisualCaptureWorkflow.ps1
          .\windows\scripts\tests\Test-ReleaseReadiness.ps1

      - name: Test Windows Rust workspace
        if: ${{ !cancelled() }}
        working-directory: windows
        run: cargo test --workspace --locked

  windows-web:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows/apps/codexu-tauri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Install pinned Windows web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Windows web contracts
        run: npm test
      - name: Build Windows web frontend
        run: npm run build
      - name: Render and verify Windows UI fixtures twice
        env:
          CODEXU_VISUAL_BROWSER: chromium
        run: |
          npx playwright install chromium
          npm run test:visual -- --update-snapshots
          npm run test:visual


  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs: [changes, macos, windows-rust-format, windows-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks for the selected platforms
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
          RUST_RESULT: ${{ needs.windows-rust-format.result }}
          WEB_RESULT: ${{ needs.windows-web.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$MACOS_RESULT" = success
          if [ "$WINDOWS_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
            test "$WEB_RESULT" = success
          else
            test "$WINDOWS_REQUIRED" = false
            test "$RUST_RESULT" = skipped
            test "$WEB_RESULT" = skipped
          fi
