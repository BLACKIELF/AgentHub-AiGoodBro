name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (must match Resources/Info.plist)"
        required: true
        type: string
      windows:
        description: Explicitly include the existing Windows installers
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: resolve-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare companion build toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: Companion/Hub/go.mod
          cache: false
      - name: Mount pinned official desktop runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          for arch in arm64 x86_64; do
            case "$arch" in
              arm64) asset_arch=arm64; env_arch=ARM64 ;;
              x86_64) asset_arch=x64; env_arch=X86_64 ;;
            esac
            pin="$(python3 - "$arch" <<'PY'
          import json, re, sys
          manifest = json.load(open('Companion/TokenMonitorDesktop/SOURCE.json'))
          version = manifest['upstream']['version']
          arch = sys.argv[1]
          runtime = manifest['runtime'] if arch == 'arm64' else manifest['architectures'][arch]['runtime']
          asset_arch = {'arm64': 'arm64', 'x86_64': 'x64'}[arch]
          if manifest['upstream']['repository'] != 'Javis603/token-monitor' or not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid pinned Token Monitor upstream')
          if manifest['runtime']['version'] != version or manifest['runtime']['architecture'] != 'arm64' or runtime['architecture'] != arch:
              raise SystemExit('Pinned Token Monitor runtime does not match its upstream')
          url = runtime['officialDMGURL']
          if url != f'https://github.com/Javis603/token-monitor/releases/download/v{version}/Token-Monitor-{version}-{asset_arch}.dmg':
              raise SystemExit('Unexpected official Token Monitor DMG URL')
          expected = runtime['officialDMGSHA256']
          if not isinstance(expected, str) or not re.fullmatch(r'[a-f0-9]{64}', expected):
              raise SystemExit('Invalid pinned Token Monitor DMG SHA256')
          print(version, expected, url)
          PY
          )"
            read -r version expected url <<< "$pin"
            dmg="$RUNNER_TEMP/Token-Monitor-${version}-${asset_arch}.dmg"
            mountpoint="$RUNNER_TEMP/token-monitor-${asset_arch}"
            curl --fail --location --retry 3 --silent --show-error --output "$dmg" "$url"
            printf '%s  %s\n' "$expected" "$dmg" | shasum -a 256 --check -
            mkdir -p "$mountpoint"
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
            printf '%s\n' "$mountpoint" > "$RUNNER_TEMP/token-monitor-${asset_arch}.mount-receipt"
            test -d "$mountpoint/Token Monitor.app"
            printf 'TOKEN_MONITOR_DESKTOP_RUNTIME_%s=%s/Token Monitor.app\n' "$env_arch" "$mountpoint" >> "$GITHUB_ENV"
            printf 'TOKEN_MONITOR_DESKTOP_DMG_%s=%s\n' "$env_arch" "$dmg" >> "$GITHUB_ENV"
            if [[ "$arch" == arm64 ]]; then
              printf 'TOKEN_MONITOR_DESKTOP_RUNTIME=%s/Token Monitor.app\n' "$mountpoint" >> "$GITHUB_ENV"
              printf 'TOKEN_MONITOR_DESKTOP_DMG=%s\n' "$dmg" >> "$GITHUB_ENV"
            fi
          done
      - name: Build and verify macOS DMGs
        run: make release-package VERSION="${{ needs.resolve-version.outputs.version }}"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aigoodbro-macos-${{ needs.resolve-version.outputs.version }}
          path: |
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg.sha256
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg.sha256
          if-no-files-found: error
      - name: Unmount pinned official desktop runtimes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for asset_arch in arm64 x64; do
            receipt="$RUNNER_TEMP/token-monitor-${asset_arch}.mount-receipt"
            mountpoint="$RUNNER_TEMP/token-monitor-${asset_arch}"
            if [[ -f "$receipt" ]] && [[ "$(cat "$receipt")" == "$mountpoint" ]]; then
              if mount | grep -F " on $mountpoint (" >/dev/null; then
                if hdiutil detach "$mountpoint"; then
                  rm -f "$receipt"
                else
                  failed=1
                fi
              else
                rm -f "$receipt"
              fi
            fi
          done
          exit "$failed"

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows == true
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Build and verify Windows installers
        shell: pwsh
        run: .\scripts\build-windows-release.ps1 -Version "${{ needs.resolve-version.outputs.version }}"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: account-manager-next-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows/*
          if-no-files-found: error

  verify:
    needs: [resolve-version, macos, windows]
    if: always() && needs.resolve-version.result == 'success' && needs.macos.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aigoodbro-macos-${{ needs.resolve-version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: account-manager-next-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows
      - name: Verify macOS checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          for arch in arm64 x86_64; do
            shasum -a 256 -c "AiGoodBro-${VERSION}-mac-${arch}.dmg.sha256"
          done
      - name: Verify optional cross-platform bundle
        if: needs.windows.result == 'success'
        run: bash scripts/check-cross-platform-release-assets.sh "${{ needs.resolve-version.outputs.version }}" dist
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: aigoodbro-release-${{ needs.resolve-version.outputs.version }}
          path: |
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg*
            dist/AiGoodBro-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg*
            dist/windows/CodexAccountManagerNext-${{ needs.resolve-version.outputs.version }}-windows-x86_64.msi*
            dist/windows/CodexAccountManagerNext-${{ needs.resolve-version.outputs.version }}-windows-x86_64-setup.exe*
          if-no-files-found: error
