[package]
name = "codexu-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain models and data readers for AiGoodBro on Windows"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
dirs.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, features = ["bundled", "chrono"] }

tempfile = "3.10"
sha2 = "0.10"
url = "2.5.8"
base64 = "0.22"
getrandom = "0.3"
toml = "=0.8.2"

# Windows-native probing for the Antigravity desktop adapter: process snapshot,
# command line, TCP owner-PID table and the loopback WinHTTP transport.
[target.'cfg(windows)'.dependencies]
# Official Codex local AF_UNIX transport; keep the existing Tokio/Tungstenite.
uds_windows = "=1.1.0"
async-io = "=2.6.0"
tokio-util = { version = "=0.7.19", features = ["compat"] }
windows = { version = "0.61.3", features = [
    "Wdk_Storage_FileSystem",
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
