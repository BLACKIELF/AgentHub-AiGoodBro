[package]
name = "codexu-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain models and data readers for Codex Account Manager Next on Windows"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
dirs.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, features = ["bundled", "chrono"] }

tempfile = "3.10"
sha2 = "0.10"

# Windows-native probing for the Antigravity desktop adapter: process snapshot,
# command line, TCP owner-PID table and the loopback WinHTTP transport.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
