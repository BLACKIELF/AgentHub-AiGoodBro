[workspace]
members = ["crates/codexu-core", "crates/codexu-cli", "apps/codexu-tauri/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Codex Account Manager Next contributors"]
license = "MIT"
repository = "https://github.com/BLACKIELF/codex-account-manager-next"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "fs", "macros", "net", "process", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Dispatch coordination keys must match next_dispatch_activity.py byte for byte.
sha2 = "0.10"

# Outbound webhook targets are security-sensitive; parse them with a real
# parser instead of hand-splitting strings.
url = "2.5"

# CLI
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
